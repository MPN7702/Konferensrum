<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konferenskarta</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    height:100vh;
}

#sidebar{
    width:260px;
    background:#f4f4f4;
    border-right:1px solid #ccc;
    overflow-y:auto;
    padding:10px;
}

.room{
    padding:10px;
    margin:4px 0;
    background:white;
    border:1px solid #bbb;
    cursor:pointer;
    border-radius:4px;
}

.room:hover{
    background:#e8f4ff;
}

#mapContainer{
    flex:1;
    overflow:auto;
    background:#ddd;
}

#map{
    position:relative;
    display:inline-block;
}

#map img{
    display:block;
    max-width:none;
}

.marker{
    position:absolute;
    width:30px;
    height:30px;
    background:#00cc00;
    border:2px solid #008000;
    border-radius:6px;
    display:none;
    cursor:move;
    font-weight:bold;
    text-align:center;
    line-height:10px;
    user-select:none;
    box-shadow:0 0 15px rgba(0,255,0,0.8);
}

.active{
    display:block;
}

</style>
</head>
<body>

<div id="sidebar">

<h2>Konferensrum</h2>

</div>

<div id="mapContainer">

<div id="map">

<img src="Konf-rum.jpg">

</div>

</div>

<script>

const rooms = [
"Brocken",
"Fryken",
"Granberget plan 2",
"Gräsberget plan 2",
"Hovfjället plan 2",
"Hänsjön",
"Kläggen",
"Kälksjön",
"Letten",
"Lilla utb-salen",
"Ljusnan",
"Stora utb-salen",
"Mangen",
"Nya matsalen",
"Röjden",
"Sirsjön",
"Tossebergsklätten plan 2",
"Valberget",
"Vassjön",
"Velen",
"Vägsjön",
];

const sidebar = document.getElementById("sidebar");
const map = document.getElementById("map");

rooms.forEach(room => {

    const btn = document.createElement("div");
    btn.className = "room";
    btn.textContent = room;
    sidebar.appendChild(btn);

    const marker = document.createElement("div");
    marker.className = "marker";
    marker.id = room;
    marker.textContent = "";

    let pos =
        JSON.parse(localStorage.getItem(room))
        || {x:50,y:50};

    marker.style.left = pos.x + "px";
    marker.style.top = pos.y + "px";

    map.appendChild(marker);

    btn.onclick = () => {

        document
        .querySelectorAll(".marker")
        .forEach(m=>m.classList.remove("active"));

        marker.classList.add("active");

    };

    makeDraggable(marker, room);

});

function makeDraggable(el, room){

    let startX=0;
    let startY=0;
    let dragging=false;

    el.addEventListener("mousedown",e=>{

        dragging=true;

        startX=e.clientX-el.offsetLeft;
        startY=e.clientY-el.offsetTop;

    });

    document.addEventListener("mousemove",e=>{

        if(!dragging) return;

        let x=e.clientX-startX;
        let y=e.clientY-startY;

        el.style.left=x+"px";
        el.style.top=y+"px";

    });

    document.addEventListener("mouseup",()=>{

        if(!dragging) return;

        dragging=false;

        localStorage.setItem(
            room,
            JSON.stringify({
                x:parseInt(el.style.left),
                y:parseInt(el.style.top)
            })
        );

    });

}

</script>

</body>
</html>

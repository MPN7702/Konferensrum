<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konferenskarta</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}

#sidebar{
    width:320px;
    background:#f4f4f4;
    border-right:1px solid #ccc;
    overflow-y:auto;
    padding:10px;
    flex-shrink:0;
}

.room{
    padding:10px;
    margin:4px 0;
    background:white;
    border:1px solid #bbb;
    border-radius:4px;
    cursor:pointer;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.room:hover{
    background:#e8f4ff;
}

.room.selected{
    background:#c8ffc8;
    font-weight:bold;
}

.room-name{
    flex:1;
}

.room-seats{
    margin-left:10px;
    font-weight:bold;
    color:#444;
    white-space:nowrap;
}

#mapContainer{
    flex:1;
    overflow:auto;
    background:#ddd;
}

#map{
    position:relative;
    display:inline-block;
}

#map img{
    display:block;
    width:1900px;
    height:auto;
    max-width:none;
    user-select:none;
}

.marker{
    position:absolute;
    width:30px;
    height:30px;
    background:#00cc00;
    border:2px solid #008000;
    border-radius:6px;
    display:none;
    cursor:move;
    box-shadow:0 0 15px rgba(0,255,0,0.8);
}

.marker.active{
    display:block;
}

#lockButton{
    position:absolute;
    left:20px;
    bottom:20px;

    z-index:1000;

    padding:10px 20px;
    font-size:16px;
    font-weight:bold;

    background:#00cc00;
    border:2px solid #666;
    border-radius:6px;

    cursor:pointer;
}

</style>
</head>

<body>

<div id="sidebar">
    <h2>Konferensrum</h2>
</div>

<div id="mapContainer">

    <div id="map">

        <img
            src="Konf-rum.jpg"
            width="1900"
            draggable="false"
            alt="Konferenskarta">

        <button id="lockButton">
            Boxar låsta
        </button>

    </div>

</div>

<script>

let boxesLocked = true;

const rooms = [

    {name:"Brocken", seats:"4P"},
    {name:"Fryken", seats:"10P"},
    {name:"Granberget plan 2", seats:"16P"},
    {name:"Gräsberget plan 2", seats:"12P"},
    {name:"Hovfjället plan 2", seats:"12P"},
    {name:"Hänsjön", seats:"2P"},
    {name:"Kymmen", seats:"4P"},
    {name:"Kläggen", seats:"5P"},
    {name:"Kälksjön", seats:"10P"},
    {name:"Letten", seats:"6P"},
    {name:"Lilla utb-salen", seats:"10P"},
    {name:"Ljusnan", seats:"10P"},
    {name:"Stora utb-salen", seats:"30+P"},
    {name:"Mangen", seats:"16P"},
    {name:"Nya matsalen", seats:"200+P"},
    {name:"Röjden", seats:"16P"},
    {name:"Sirsjön", seats:"10P"},
    {name:"Tossebergsklätten plan 2", seats:"18P"},
    {name:"Valberget plan 2", seats:"8P"},
    {name:"Vassjön", seats:"8P"},
    {name:"Velen", seats:"4P"},
    {name:"Vägsjön", seats:"4P"}

];

const positions = {

    "Brocken": {x:1244,y:666},
    "Fryken": {x:1211,y:667},
    "Granberget plan 2": {x:1222,y:593},
    "Gräsberget plan 2": {x:1546,y:3},
    "Hovfjället plan 2": {x:1517,y:65},
    "Hänsjön": {x:1186,y:543},
    "Kymmen": {x:1126,y:427},
    "Kläggen": {x:1177,y:349},
    "Kälksjön": {x:521,y:369},
    "Letten": {x:1242,y:610},
    "Lilla utb-salen": {x:261,y:290},
    "Ljusnan": {x:1754,y:429},
    "Stora utb-salen": {x:254,y:223},
    "Mangen": {x:225,y:61},
    "Nya matsalen": {x:1151,y:757},
    "Röjden": {x:1548,y:1009},
    "Sirsjön": {x:334,y:194},
    "Tossebergsklätten plan 2": {x:1063,y:595},
    "Valberget plan 2": {x:1239,y:428},
    "Vassjön": {x:1243,y:575},
    "Velen": {x:1107,y:634},
    "Vägsjön": {x:1234,y:548}

};

const sidebar = document.getElementById("sidebar");
const map = document.getElementById("map");

rooms.forEach(room => {

    const btn = document.createElement("div");
    btn.className = "room";

    btn.innerHTML = `
        <span class="room-name">${room.name}</span>
        <span class="room-seats">${room.seats}</span>
    `;

    sidebar.appendChild(btn);

    const marker = document.createElement("div");
    marker.className = "marker";

    marker.style.left = positions[room.name].x + "px";
    marker.style.top = positions[room.name].y + "px";

    map.appendChild(marker);

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    marker.addEventListener("mousedown", e => {

        if(boxesLocked) return;

        dragging = true;

        offsetX = e.clientX - marker.offsetLeft;
        offsetY = e.clientY - marker.offsetTop;

        e.preventDefault();

    });

    document.addEventListener("mousemove", e => {

        if(!dragging) return;

        marker.style.left =
            (e.clientX - offsetX) + "px";

        marker.style.top =
            (e.clientY - offsetY) + "px";

    });

    document.addEventListener("mouseup", () => {

        if(!dragging) return;

        dragging = false;

        console.log(
            room.name,
            {
                x: parseInt(marker.style.left),
                y: parseInt(marker.style.top)
            }
        );

    });

    btn.addEventListener("click", () => {

        document.querySelectorAll(".marker")
            .forEach(m => m.classList.remove("active"));

        document.querySelectorAll(".room")
            .forEach(r => r.classList.remove("selected"));

        marker.classList.add("active");
        btn.classList.add("selected");

    });

});

document.getElementById("lockButton")
.addEventListener("click", () => {

    boxesLocked = !boxesLocked;

    const btn = document.getElementById("lockButton");

    if(boxesLocked){

        btn.textContent = "Boxar låsta";
        btn.style.background = "#00cc00";

    }else{

        btn.textContent = "Boxar upplåsta";
        btn.style.background = "#ffcc00";

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konferenskarta</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}

#sidebar{
    width:260px;
    background:#f4f4f4;
    border-right:1px solid #ccc;
    overflow-y:auto;
    padding:10px;
    flex-shrink:0;
}

.room{
    padding:10px;
    margin:4px 0;
    background:white;
    border:1px solid #bbb;
    border-radius:4px;
    cursor:pointer;
}

.room:hover{
    background:#e8f4ff;
}

.room.selected{
    background:#c8ffc8;
    font-weight:bold;
}

#mapContainer{
    flex:1;
    overflow:auto;
    background:#ddd;
}

#map{
    position:relative;
    display:inline-block;
}

#map img{
    display:block;
    width:1900px;
    height:auto;
    max-width:none;
    user-select:none;
}

.marker{
    position:absolute;
    width:30px;
    height:30px;
    background:#00cc00;
    border:2px solid #008000;
    border-radius:6px;
    display:none;
    cursor:move;
    box-shadow:0 0 15px rgba(0,255,0,0.8);
}

.marker.active{
    display:block;
}

</style>
</head>

<body>

<div id="sidebar">
    <h2>Konferensrum</h2>
</div>

<div id="mapContainer">
    <div id="map">
        <img
            src="Konf-rum.jpg"
            width="1900"
            draggable="false"
            alt="Konferenskarta">
    </div>
</div>

<script>

const rooms = [
    "Brocken",
    "Fryken",
    "Granberget plan 2",
    "Gräsberget plan 2",
    "Hovfjället plan 2",
    "Hänsjön",
    "Kymmen",
    "Kläggen",
    "Kälksjön",
    "Letten",
    "Lilla utb-salen",
    "Ljusnan",
    "Stora utb-salen",
    "Mangen",
    "Nya matsalen",
    "Röjden",
    "Sirsjön",
    "Tossebergsklätten plan 2",
    "Valberget plan 2",
    "Vassjön",
    "Velen",
    "Vägsjön"
];

const positions = {

    "Brocken": {x:1206,y:647},
    "Fryken": {x:1173,y:646},
    "Granberget plan 2": {x:1182,y:571},
    "Gräsberget plan 2": {x:1495,y:7},
    "Hovfjället plan 2": {x:1471,y:86},
    "Hänsjön": {x:1151,y:527},
    "Kymmen": {x:1094,y:414},
    "Kläggen": {x:1140,y:338},
    "Kälksjön": {x:508,y:357},
    "Letten": {x:1205,y:593},
    "Lilla utb-salen": {x:254,y:280},
    "Ljusnan": {x:1700,y:417},
    "Stora utb-salen": {x:250,y:212},
    "Mangen": {x:218,y:63},
    "Nya matsalen": {x:1109,y:733},
    "Röjden": {x:1503,y:978},
    "Sirsjön": {x:322,y:187},
    "Tossebergsklätten plan 2": {x:1029,y:576},
    "Valberget plan 2": {x:1203,y:415},
    "Vassjön": {x:1204,y:557},
    "Velen": {x:1073,y:613},
    "Vägsjön": {x:1195,y:530}

};

const sidebar = document.getElementById("sidebar");
const map = document.getElementById("map");

rooms.forEach(room => {

    const btn = document.createElement("div");
    btn.className = "room";
    btn.textContent = room;
    sidebar.appendChild(btn);

    const marker = document.createElement("div");
    marker.className = "marker";

    marker.style.left = positions[room].x + "px";
    marker.style.top = positions[room].y + "px";

    map.appendChild(marker);

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    marker.addEventListener("mousedown", e => {

        dragging = true;

        offsetX = e.clientX - marker.offsetLeft;
        offsetY = e.clientY - marker.offsetTop;

        e.preventDefault();

    });

    document.addEventListener("mousemove", e => {

        if(!dragging) return;

        marker.style.left =
            (e.clientX - offsetX) + "px";

        marker.style.top =
            (e.clientY - offsetY) + "px";

    });

    document.addEventListener("mouseup", () => {

        if(!dragging) return;

        dragging = false;

        console.log(
            room,
            {
                x: parseInt(marker.style.left),
                y: parseInt(marker.style.top)
            }
        );

    });

    btn.addEventListener("click", () => {

        document.querySelectorAll(".marker")
            .forEach(m => m.classList.remove("active"));

        document.querySelectorAll(".room")
            .forEach(r => r.classList.remove("selected"));

        marker.classList.add("active");
        btn.classList.add("selected");

    });

});

</script>

</body>
</html>

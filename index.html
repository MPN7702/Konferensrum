<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konferenskarta</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
}

/* Vänstermenyn */

#sidebar{
    width:280px;
    background:#f4f4f4;
    border-right:1px solid #ccc;
    overflow-y:auto;
    padding:15px;
    flex-shrink:0;
}

#sidebar h2{
    margin-top:0;
}

.room{
    padding:10px;
    margin-bottom:5px;
    background:white;
    border:1px solid #ccc;
    border-radius:5px;
    cursor:pointer;
}

.room:hover{
    background:#e8f4ff;
}

.room.selected{
    background:#c8ffc8;
    font-weight:bold;
}

/* Kartyta */

#mapContainer{
    flex:1;
    overflow:auto;
    background:#dcdcdc;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:20px;
}

#map{
    position:relative;
}

/* Fast storlek på bilden */

#map img{
    width:1800px;
    height:auto;
    display:block;
}

/* Grön markör */

.marker{
    position:absolute;

    width:30px;
    height:30px;

    background:#00ff00;
    border:2px solid #008000;
    border-radius:6px;

    display:none;

    box-shadow:0 0 15px rgba(0,255,0,0.9);
}

.marker.active{
    display:block;
}

</style>
</head>

<body>

<div id="sidebar">
    <h2>Konferensrum</h2>
</div>

<div id="mapContainer">

    <div id="map">
        <img src="Konf-rum.jpg" alt="Konferenskarta">
    </div>

</div>

<script>

const rooms = [
    "Brocken",
    "Fryken",
    "Granberget plan 2",
    "Gräsberget plan 2",
    "Hovfjället plan 2",
    "Hänsjön",
    "Kymmen",
    "Kläggen",
    "Kälksjön",
    "Letten",
    "Lilla utb-salen",
    "Ljusnan",
    "Stora utb-salen",
    "Mangen",
    "Nya matsalen",
    "Röjden",
    "Sirsjön",
    "Tossebergsklätten plan 2",
    "Valberget plan 2",
    "Vassjön",
    "Velen",
    "Vägsjön"
];

const positions = {

    "Brocken":                 {x:1206,y:647},
    "Fryken":                  {x:1173,y:646},
    "Granberget plan 2":       {x:1182,y:571},
    "Gräsberget plan 2":       {x:1495,y:7},
    "Hovfjället plan 2":       {x:1471,y:86},
    "Hänsjön":                 {x:1151,y:527},
    "Kymmen":                  {x:1094,y:414},
    "Kläggen":                 {x:1140,y:338},
    "Kälksjön":                {x:508,y:357},
    "Letten":                  {x:1205,y:593},
    "Lilla utb-salen":         {x:254,y:280},
    "Ljusnan":                 {x:1700,y:417},
    "Stora utb-salen":         {x:250,y:212},
    "Mangen":                  {x:218,y:63},
    "Nya matsalen":            {x:1109,y:733},
    "Röjden":                  {x:1503,y:978},
    "Sirsjön":                 {x:322,y:187},
    "Tossebergsklätten plan 2":{x:1029,y:576},
    "Valberget plan 2":        {x:1203,y:415},
    "Vassjön":                 {x:1204,y:557},
    "Velen":                   {x:1073,y:613},
    "Vägsjön":                 {x:1195,y:530}
};

const sidebar = document.getElementById("sidebar");
const map = document.getElementById("map");

rooms.forEach(room => {

    const button = document.createElement("div");
    button.className = "room";
    button.textContent = room;
    sidebar.appendChild(button);

    const marker = document.createElement("div");
    marker.className = "marker";

    marker.style.left = positions[room].x + "px";
    marker.style.top  = positions[room].y + "px";

    map.appendChild(marker);

    button.addEventListener("click", () => {

        document.querySelectorAll(".marker")
            .forEach(m => m.classList.remove("active"));

        document.querySelectorAll(".room")
            .forEach(r => r.classList.remove("selected"));

        marker.classList.add("active");
        button.classList.add("selected");

    });

});

</script>

</body>
</html>

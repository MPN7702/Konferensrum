<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konferenskarta</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}

#sidebar{
    width:22%;
    min-width:280px;
    max-width:450px;

    height:100vh;

    background:#f4f4f4;
    border-right:1px solid #ccc;
    overflow:hidden;
    padding:10px;
    flex-shrink:0;
}
    #sidebar h2{
    margin-top:0;
    font-size:clamp(18px,1.4vw,28px);
}

.room{
    padding:clamp(4px,0.5vw,10px);
    margin:4px 0;
    background:white;
    border:1px solid #bbb;
    border-radius:4px;
    cursor:pointer;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:clamp(12px,0.9vw,16px);
}

.room:hover{
    background:#e8f4ff;
}

.room.selected{
    background:#c8ffc8;
    font-weight:bold;
}

.room-name{
    flex:1;
}

.room-seats{
    margin-left:10px;
    font-weight:bold;
    color:#444;
    white-space:nowrap;

    font-size:clamp(11px,0.8vw,15px);
}

#mapContainer{
    flex:1;
    overflow:hidden;
    background:#ddd;

    display:flex;
    justify-content:center;
    align-items:center;
}


#map{
    position:relative;
    width:100%;
    height:100%;
}

#map img{
    position:absolute;

    width:100%;
    height:100%;

    object-fit:contain;

    user-select:none;
}

.marker{
    position:absolute;
    width:30px;
    height:30px;
    background:#00cc00;
    border:2px solid #008000;
    border-radius:6px;
    display:none;
    cursor:move;
    box-shadow:0 0 15px rgba(0,255,0,0.8);
}

.marker.active{
    display:block;
}

#lockButton{
    position:absolute;
    left:20px;
    bottom:20px;

    z-index:1000;

    padding:10px 20px;
    font-size:16px;
    font-weight:bold;

    background:#00cc00;
    border:2px solid #666;
    border-radius:6px;

    cursor:pointer;
}

</style>
</head>

<body>

<div id="sidebar">
    <h2>Konferensrum</h2>
</div>

<div id="mapContainer">

    <div id="map">

        <img
            id="mapImage"
            src="Konf-rum.jpg"
            draggable="false"
            alt="Konferenskarta">

        <button id="lockButton">
            Rum låsta
        </button>

    </div>

</div>

<script>

let boxesLocked = true;

const rooms = [

    {name:"Brocken", seats:"4P"},
    {name:"Fryken", seats:"10P"},
    {name:"Granberget plan 2", seats:"16P"},
    {name:"Gräsberget plan 2", seats:"12P"},
    {name:"Hovfjället plan 2", seats:"12P"},
    {name:"Hänsjön", seats:"2P"},
    {name:"Kymmen", seats:"4P"},
    {name:"Kläggen", seats:"5P"},
    {name:"Kälksjön", seats:"10P"},
    {name:"Letten", seats:"6P"},
    {name:"Lilla utb-salen", seats:"10P"},
    {name:"Ljusnan", seats:"10P"},
    {name:"Stora utb-salen", seats:"30+P"},
    {name:"Mangen", seats:"16P"},
    {name:"Nya matsalen", seats:"200+P"},
    {name:"Röjden", seats:"16P"},
    {name:"Sirsjön", seats:"10P"},
    {name:"Tossebergsklätten plan 2", seats:"18P"},
    {name:"Valberget plan 2", seats:"8P"},
    {name:"Vassjön", seats:"8P"},
    {name:"Velen", seats:"4P"},
    {name:"Vägsjön", seats:"4P"}

];

const positions = {

    "Brocken": {x:65.4737,y:63.4890},
    "Fryken": {x:63.7368,y:63.5844},
    "Granberget plan 2": {x:64.3158,y:56.5300},
    "Gräsberget plan 2": {x:81.3684,y:0.2860},
    "Hovfjället plan 2": {x:79.8421,y:6.1964},
    "Hänsjön": {x:62.4211,y:51.7636},
    "Kymmen": {x:59.2632,y:40.7054},
    "Kläggen": {x:61.9474,y:33.2698},
    "Kälksjön": {x:27.4211,y:35.1764},
    "Letten": {x:65.3684,y:58.1506},
    "Lilla utb-salen": {x:13.7368,y:27.6454},
    "Ljusnan": {x:92.3158,y:40.8961},
    "Stora utb-salen": {x:13.3684,y:21.2583},
    "Mangen": {x:11.8421,y:5.8151},
    "Nya matsalen": {x:60.5789,y:72.1640},
    "Röjden": {x:81.4737,y:96.1868},
    "Sirsjön": {x:17.5789,y:18.4938},
    "Tossebergsklätten plan 2": {x:55.9474,y:56.7207},
    "Valberget plan 2": {x:65.2105,y:40.8008},
    "Vassjön": {x:65.4211,y:54.8141},
    "Velen": {x:58.2632,y:60.4385},
    "Vägsjön": {x:64.9474,y:52.2402}

};

const sidebar = document.getElementById("sidebar");
const map = document.getElementById("map");
const img = document.getElementById("mapImage");

function positionMarker(marker, roomName){

    marker.style.left =
        ((img.clientWidth * positions[roomName].x) / 100) + "px";

    marker.style.top =
        ((img.clientHeight * positions[roomName].y) / 100) + "px";
}

rooms.forEach(room => {

    const btn = document.createElement("div");
    btn.className = "room";

    btn.innerHTML = `
        <span class="room-name">${room.name}</span>
        <span class="room-seats">${room.seats}</span>
    `;

    sidebar.appendChild(btn);

    const marker = document.createElement("div");
    marker.className = "marker";
    marker.dataset.room = room.name;

    map.appendChild(marker);

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    marker.addEventListener("mousedown", e => {

        if(boxesLocked) return;

        dragging = true;

        offsetX = e.clientX - marker.offsetLeft;
        offsetY = e.clientY - marker.offsetTop;

        e.preventDefault();

    });

    document.addEventListener("mousemove", e => {

        if(!dragging) return;

        marker.style.left = (e.clientX - offsetX) + "px";
        marker.style.top = (e.clientY - offsetY) + "px";

    });

    document.addEventListener("mouseup", () => {

        if(!dragging) return;

        dragging = false;

console.log(
    `"${room.name}": {x:${((parseInt(marker.style.left)/img.clientWidth)*100).toFixed(4)}, y:${((parseInt(marker.style.top)/img.clientHeight)*100).toFixed(4)}}`
);

    });

    btn.addEventListener("click", () => {

        document.querySelectorAll(".marker")
            .forEach(m => m.classList.remove("active"));

        document.querySelectorAll(".room")
            .forEach(r => r.classList.remove("selected"));

        marker.classList.add("active");
        btn.classList.add("selected");

    });

});

function updateMarkers(){

    document.querySelectorAll(".marker").forEach(marker => {

        positionMarker(marker, marker.dataset.room);

    });

}

window.addEventListener("load", updateMarkers);
window.addEventListener("resize", updateMarkers);

document.getElementById("lockButton")
.addEventListener("click", () => {

    boxesLocked = !boxesLocked;

    const btn = document.getElementById("lockButton");

    if(boxesLocked){

        btn.textContent = "Rum låsta";
        btn.style.background = "#00cc00";

    }else{

        btn.textContent = "Rum upplåsta";
        btn.style.background = "#ffcc00";

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konferenskarta</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}

#sidebar{
    width:260px;
    background:#f4f4f4;
    border-right:1px solid #ccc;
    overflow-y:auto;
    padding:10px;
    flex-shrink:0;
}

.room{
    padding:10px;
    margin:4px 0;
    background:white;
    border:1px solid #bbb;
    border-radius:4px;
    cursor:pointer;
}

.room:hover{
    background:#e8f4ff;
}

.room.selected{
    background:#c8ffc8;
    font-weight:bold;
}

#mapContainer{
    flex:1;
    overflow:auto;
    background:#ddd;
}

#map{
    position:relative;
    display:inline-block;
}

#map img{
    display:block;
    width:1900px;
    height:auto;
    max-width:none;
    pointer-events:none;
    user-select:none;
}

.marker{
    position:absolute;
    width:30px;
    height:30px;
    background:#00cc00;
    border:2px solid #008000;
    border-radius:6px;
    display:none;
    pointer-events:none;
    box-shadow:0 0 15px rgba(0,255,0,0.8);

    transform:translate(-50%,-50%);
}

.marker.active{
    display:block;
}

</style>
</head>

<body>

<div id="sidebar">
    <h2>Konferensrum</h2>
</div>

<div id="mapContainer">
    <div id="map">
        <img id="mapImage"
             src="Konf-rum.jpg"
             width="1900"
             draggable="false"
             alt="Konferenskarta">
    </div>
</div>

<script>

const rooms = [
"Brocken",
"Fryken",
"Granberget plan 2",
"Gräsberget plan 2",
"Hovfjället plan 2",
"Hänsjön",
"Kymmen",
"Kläggen",
"Kälksjön",
"Letten",
"Lilla utb-salen",
"Ljusnan",
"Stora utb-salen",
"Mangen",
"Nya matsalen",
"Röjden",
"Sirsjön",
"Tossebergsklätten plan 2",
"Valberget plan 2",
"Vassjön",
"Velen",
"Vägsjön"
];

/*
Koordinater från din gamla karta
Bildbredd: 1900 px
Bildhöjd: ca 1070 px
*/

const positions = {

"Brocken":                 {x:63.47,y:60.47},
"Fryken":                  {x:61.74,y:60.37},
"Granberget plan 2":       {x:62.21,y:53.36},
"Gräsberget plan 2":       {x:78.68,y:0.65},
"Hovfjället plan 2":       {x:77.42,y:8.04},
"Hänsjön":                 {x:60.58,y:49.25},
"Kymmen":                  {x:57.58,y:38.69},
"Kläggen":                 {x:60.00,y:31.59},
"Kälksjön":                {x:26.74,y:33.36},
"Letten":                  {x:63.42,y:55.42},
"Lilla utb-salen":         {x:13.37,y:26.17},
"Ljusnan":                 {x:89.47,y:38.97},
"Stora utb-salen":         {x:13.16,y:19.81},
"Mangen":                  {x:11.47,y:5.89},
"Nya matsalen":            {x:58.37,y:68.50},
"Röjden":                  {x:79.11,y:91.40},
"Sirsjön":                 {x:16.95,y:17.48},
"Tossebergsklätten plan 2":{x:54.16,y:53.83},
"Valberget plan 2":        {x:63.32,y:38.79},
"Vassjön":                 {x:63.37,y:52.06},
"Velen":                   {x:56.47,y:57.29},
"Vägsjön":                 {x:62.89,y:49.53}

};

const sidebar = document.getElementById("sidebar");
const map = document.getElementById("map");
const img = document.getElementById("mapImage");

rooms.forEach(room => {

    const btn = document.createElement("div");
    btn.className = "room";
    btn.textContent = room;
    sidebar.appendChild(btn);

    const marker = document.createElement("div");
    marker.className = "marker";

    marker.dataset.room = room;

    map.appendChild(marker);

    btn.addEventListener("click", () => {

        document
            .querySelectorAll(".marker")
            .forEach(m => m.classList.remove("active"));

        document
            .querySelectorAll(".room")
            .forEach(r => r.classList.remove("selected"));

        marker.classList.add("active");
        btn.classList.add("selected");
    });

});

function positionMarkers(){

    document.querySelectorAll(".marker").forEach(marker => {

        const room = marker.dataset.room;
        const pos = positions[room];

        marker.style.left =
            (img.clientWidth * pos.x / 100) + "px";

        marker.style.top =
            (img.clientHeight * pos.y / 100) + "px";
    });

}

window.addEventListener("load", positionMarkers);
window.addEventListener("resize", positionMarkers);

</script>

</body>
</html>
